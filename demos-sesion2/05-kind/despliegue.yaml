# B7 - La bascula: MISMO limite de memoria para los dos.
#
# LIMITE CORREGIDO 22-sep-2026 tras medir DENTRO del contenedor Linux arm64.
# El guion decia 32Mi a partir del RSS medido en macOS (Go 10.7-11.1 MB,
# Node 43-51.5 MB). Esas cifras NO aplican dentro del contenedor: ahi
# Go usa 4.96 MiB y Node 10.56 MiB, y con 32Mi SOBREVIVEN LOS DOS.
#
# Medido: node muere con OOMKilled a 10Mi y sobrevive a 11Mi.
#         go corre a 4.96 MiB (49.6% de 10Mi) y sobrevive hasta 6Mi.
# Repetido 4 veces a 10Mi: node OOMKilled 4/4, go Running 4/4.
# NO subir a 11Mi (Node sobrevive) ni bajar a 6Mi (Go queda sin margen).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-go
  labels: { app: api-go }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-go }
  template:
    metadata:
      labels: { app: api-go }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: api-go
          image: api-go:v1
          # Explicito: con :latest la politica por omision seria Always
          # y el pod se queda en ErrImagePull aunque kind load ya la cargo.
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            # Descomentar SOLO si api-go se reinicia dentro del contenedor.
            # - name: GOMEMLIMIT
            #   value: "8MiB"
            - name: PORT
              value: "8080"
          resources:
            requests: { memory: "8Mi",  cpu: "50m" }
            limits:   { memory: "10Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-go
spec:
  # ClusterIP + port-forward. En kind un NodePort NO es accesible desde el Mac
  # salvo que el cluster se haya creado con extraPortMappings.
  type: ClusterIP
  selector: { app: api-go }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-node
  labels: { app: api-node }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-node }
  template:
    metadata:
      labels: { app: api-node }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api-node
          image: api-node:v1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: PORT
              value: "8080"
          resources:
            requests: { memory: "8Mi",  cpu: "50m" }
            limits:   { memory: "10Mi", cpu: "500m" }   # el MISMO limite
---
apiVersion: v1
kind: Service
metadata:
  name: api-node
spec:
  type: ClusterIP
  selector: { app: api-node }
  ports: [{ port: 80, targetPort: 8080 }]
