# Clúster kind de la sesión 4.  Crear con:
#   kind create cluster --config k8s/kind-config.yaml
#
# Es un clúster NUEVO (s04-rest); no toca el clúster "backend" de la sesión 2.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: s04-rest
nodes:
  - role: control-plane
    # Imagen de nodo FIJADA (la misma que usa kind v0.33.0 por omisión).
    # Fijarla evita sorpresas si alguien actualiza kind antes de la clase.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # El "nodo" de kind es un contenedor de Docker. Sin este mapeo, el
    # NodePort 30080 existe DENTRO de ese contenedor pero la Mac no lo ve.
    # Con él:  Mac:30080  ->  contenedor-nodo:30080  ->  Service  ->  pods.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP
